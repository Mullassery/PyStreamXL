[package]
name = "streamxl-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "streamxl_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = "2"
quick-xml = { version = "0.42", features = ["async-tokio"] }
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Safe self-referential struct (owned ZipArchive + a decompressing reader
# borrowed from it) needed to make row streaming genuinely O(1) memory --
# see core/src/stream.rs. No proc-macros, no unsafe code in this crate.
self_cell = "1"

[features]
python = ["pyo3"]

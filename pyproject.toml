[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "streamxl"
version = "5.3.0"
description = "High-performance .xlsx file reader with formula extraction, comment support, and cross-sheet dependency analysis. Streams large .xlsx files row-by-row without loading the entire file into memory; 3.8-5.6x faster than openpyxl in this repo's own committed benchmarks (see benchmarks/results.md). Rust-powered, Python API."
authors = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
maintainers = [{ name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com" }]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.8"
dependencies = ["rich>=13.0"]
keywords = [
    "excel",
    "xlsx",
    "spreadsheet",
    "streaming",
    "file-parsing",
    "data-loading",
    "performance",
    "rust",
    "python-api",
    "memory-efficient",
    "big-data",
    "etl",
    "data-pipeline",
    "file-handling",
    "openpyxl-alternative",
    "pandas-io",
    "data-engineering",
    "batch-processing",
    "file-processing",
    "performance-optimization"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Office/Business",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
pystreamxl = "streamxl.cli:main"

[project.urls]
Homepage = "https://github.com/Mullassery/PyStreamXL"
Repository = "https://github.com/Mullassery/PyStreamXL"
Documentation = "https://github.com/Mullassery/PyStreamXL#readme"
"Bug Tracker" = "https://github.com/Mullassery/PyStreamXL/issues"
Changelog = "https://github.com/Mullassery/PyStreamXL/releases"
"Source Code" = "https://github.com/Mullassery/PyStreamXL/tree/main"
Discussions = "https://github.com/Mullassery/PyStreamXL/discussions"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flask>=3.1.3",
    "openpyxl>=3.0",
]
server = [
    "flask>=3.1.3",
]

[tool.maturin]
python-source = "python"
module-name = "streamxl._core"
manifest-path = "python/Cargo.toml"
include = ["LICENSE", "README.md"]

name: CodeAtlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codeatlas
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CodeAtlas
        run: pip install codeatlas-rs codeatlas-bundle
      - name: Configure git
        run: |
          git config user.name "codeatlas-bundle"
          git config user.email "codeatlas-bundle@users.noreply.github.com"
      - name: Refresh architecture map
        run: codeatlas-bundle build --commit
      - name: Push
        run: git push

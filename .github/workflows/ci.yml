name: Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core

      - name: cargo fmt --check
        run: cargo fmt --check --manifest-path core/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

      - name: Install lint tools
        run: pip install black==24.1.1 ruff==0.2.0

      - name: black --check
        run: black --check python/ tests/

      - name: ruff check
        run: ruff check python/ tests/

  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            core
            python

      - name: Build Rust
        run: cargo build --release --all-features

      - name: Test Rust
        run: cargo test --release --all-features

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            python

      # The project root (not python/) holds pyproject.toml; maturin's
      # PEP 517 build backend reads `manifest-path = "python/Cargo.toml"`
      # from it and compiles the Rust extension as part of this install.
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      # Tests live in the top-level tests/ directory. This step must run
      # unconditionally so a real test failure fails the job — it must
      # never be able to silently no-op.
      - name: Run pytest
        run: pytest tests/ -v --tb=short

      - name: Streaming throughput & memory regression check (RECHECK-017)
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import tempfile, time, tracemalloc, pystreamxl
          rows = [[f"cell_{i}", float(i), i % 2 == 0, "<tag> & \"quote\""] for i in range(10_000)]
          with tempfile.NamedTemporaryFile(suffix=".xlsx") as tmp:
              t0 = time.perf_counter()
              pystreamxl.write(tmp.name, rows)
              tracemalloc.start()
              out = list(pystreamxl.read(tmp.name))
              _, peak = tracemalloc.get_traced_memory()
              tracemalloc.stop()
              elapsed = time.perf_counter() - t0
              assert len(out) == 10_000 and out[0][3] == '<tag> & "quote"'
              assert elapsed < 10.0, f"10k-row roundtrip regressed: {elapsed:.2f}s"
              assert peak < 64 * 1024 * 1024, f"Python heap exceeded 64 MiB: {peak}"
              print(f"Benchmark OK: 10k rows in {elapsed:.3f}s, peak Python heap {peak/1024:.1f} KiB")
          PY

  wheel-smoke:
    name: Wheel Install Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Cover the oldest supported interpreter and the newest one the
        # release workflow builds, so a broken wheel tag or missing
        # extension fails here rather than on a user's machine.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            python

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir wheelhouse .

      - name: Install built wheel (non-editable)
        run: python -m pip install --force-reinstall wheelhouse/*.whl

      - name: Import and round-trip smoke test
        run: python scripts/wheel_smoke.py

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    # This job needs network access to crates.io/PyPI advisory
    # databases, which isn't available in the sandbox this workflow was
    # authored in — it has not been run/verified end-to-end here. It's
    # added on the expectation that GitHub-hosted runners have normal
    # network access; if it misbehaves in practice, that's a real CI
    # bug to fix, not a pre-existing known issue.
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and pip-audit
        run: |
          pip install -e ".[dev,server]"
          pip install pip-audit

      # Scans the actual installed environment (this project's runtime +
      # dev + server extras) against the PyPI advisory database. This
      # step is intentionally allowed to fail the job on findings — no
      # `|| true` masking.
      - name: Audit Python dependencies
        run: pip-audit

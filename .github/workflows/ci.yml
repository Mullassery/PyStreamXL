name: Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            core
            python

      - name: Build Rust
        run: cargo build --release --all-features

      - name: Test Rust
        run: cargo test --release --all-features

  python-tests:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            python

      # The project root (not python/) holds pyproject.toml; maturin's
      # PEP 517 build backend reads `manifest-path = "python/Cargo.toml"`
      # from it and compiles the Rust extension as part of this install.
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      # Tests live in the top-level tests/ directory. This step must run
      # unconditionally so a real test failure fails the job — it must
      # never be able to silently no-op.
      - name: Run pytest
        run: pytest tests/ -v --tb=short

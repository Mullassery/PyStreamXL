repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  # rust-lang/rust-clippy and rust-lang/rustfmt do not actually publish a
  # .pre-commit-hooks.yaml (verified: both 404 at any tag) -- they are the
  # upstream tool source repos, not pre-commit-hook mirrors. Using the
  # known-working community mirror instead (verified working 2026-10-06).
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: clippy
        args: ['--', '-D', 'warnings']

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.0
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format
